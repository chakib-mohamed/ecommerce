quarkus.http.test-port=0
# The tests run against the schema the migrations build, and check the entities against it.
#
# This was drop-and-create, which had Hibernate build the schema from the entities - so the two
# agreed by construction and could not disagree, whatever Liquibase actually produced. The suite
# passed against a schema production never uses, and a changeset at odds with an entity reached
# deployment unchallenged. `validate` rather than `none` (analytics-service's choice) because
# getting onto the real schema without checking it against the mapping only fixes half of it.
quarkus.hibernate-orm.database.generation=validate
# The production changelog plus a fixture only the tests need. It lives in test resources and so
# cannot reach a packaged application; a context attribute would not have prevented that, since
# Liquibase applies everything when no contexts are set at runtime, which is the case in Compose.
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-test.xml
quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:tc:postgresql:16-alpine:///products
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.datasource.jdbc.driver=org.testcontainers.jdbc.ContainerDatabaseDriver
quarkus.datasource.jdbc.acquisition-timeout=PT300S
%test.quarkus.devservices.enabled=false

# Outbox relay: park the scheduled timer far out so pollAndPublish()/requestPoll()
# are the only triggers during tests (deterministic, no background ticks).
products.outbox.poll-interval=24h
products.outbox.batch-size=100

# Outbox purge: park the purge timer too so purgeOldPublished() is the only trigger in tests.
products.outbox.purge-interval=24h
products.outbox.retention=P7D
