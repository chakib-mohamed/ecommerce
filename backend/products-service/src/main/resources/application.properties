# Configuration file
# key = value
#quarkus.http.cors=true
quarkus.application.name=products-service
quarkus.http.port=8080

## Log format - traceId/spanId are loaded into MDC by OpenTelemetry on every line
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] traceId=%X{traceId} spanId=%X{spanId} %s%e%n

## OpenTelemetry - export spans to the collector over OTLP/gRPC; it tail-samples and forwards to Jaeger
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.traces.sampler=always_on
# ship application logs over OTLP to the Collector (additive - console handler stays on)
quarkus.otel.logs.enabled=true
# dev (make dev-*) runs natively on the host, where the collector is reachable on localhost
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# tests have no collector; disable the SDK so the exporter does not spam connection failures
%test.quarkus.otel.sdk.disabled=true


# postgres datasource
quarkus.datasource.db-kind = postgresql
quarkus.datasource.jdbc.acquisition-timeout=PT300S
quarkus.datasource.jdbc.url = jdbc:postgresql://postgres:5432/products
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Liquibase owns the schema, so Hibernate must not touch it - but it should still check that what
# it expects and what Liquibase built are the same thing. Left unset the default is `none`, which
# checks nothing: a field mapped to a column that does not exist is found by the first query to
# need it, in whatever code path happens to run first. payment-service spent its life in exactly
# that state, coming up healthy and throwing on every outbox poll, because nothing validated the
# mapping at startup. analytics-service already sets this.
quarkus.hibernate-orm.database.generation=validate


# Liquibase minimal config properties
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Kafka configuration
%dev.kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.price-changed.connector=smallrye-kafka
mp.messaging.incoming.price-changed.topic=price-changed
mp.messaging.incoming.price-changed.value.deserializer=the.chak.ecommerce.products.control.events.PriceChangedEventDeserializer
# Consumer DLQ hardening (spec section 5): isolate poison messages instead of blocking the partition.
# A terminal-failure message (deserialization failure, or processing that fails every @Retry attempt)
# is routed to price-changed-dlq; the existing idempotent updatePrice upsert is unchanged.
mp.messaging.incoming.price-changed.group.id=products-service-price-changed
mp.messaging.incoming.price-changed.failure-strategy=dead-letter-queue
mp.messaging.incoming.price-changed.dead-letter-queue.topic=price-changed-dlq
mp.messaging.incoming.price-changed.fail-on-deserialization-failure=false
# DLQ forwards the original record's raw bytes; serializers cannot be deduced from the custom
# JSON-B deserializer, so set them explicitly (String key, raw-byte value).
mp.messaging.incoming.price-changed.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.price-changed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Saga stock commands from orders-service. Same DLQ hardening as price-changed: a poison
# command must not block the partition and stall every other order's reservation.
mp.messaging.incoming.reserve-stock.connector=smallrye-kafka
mp.messaging.incoming.reserve-stock.topic=reserve-stock
mp.messaging.incoming.reserve-stock.value.deserializer=the.chak.ecommerce.products.control.events.ReserveStockCommandDeserializer
mp.messaging.incoming.reserve-stock.group.id=products-service-reserve-stock
mp.messaging.incoming.reserve-stock.failure-strategy=dead-letter-queue
mp.messaging.incoming.reserve-stock.dead-letter-queue.topic=reserve-stock-dlq
mp.messaging.incoming.reserve-stock.fail-on-deserialization-failure=false
mp.messaging.incoming.reserve-stock.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.reserve-stock.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

mp.messaging.incoming.release-stock.connector=smallrye-kafka
mp.messaging.incoming.release-stock.topic=release-stock
mp.messaging.incoming.release-stock.value.deserializer=the.chak.ecommerce.products.control.events.ReleaseStockCommandDeserializer
mp.messaging.incoming.release-stock.group.id=products-service-release-stock
mp.messaging.incoming.release-stock.failure-strategy=dead-letter-queue
mp.messaging.incoming.release-stock.dead-letter-queue.topic=release-stock-dlq
mp.messaging.incoming.release-stock.fail-on-deserialization-failure=false
mp.messaging.incoming.release-stock.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.release-stock.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Saga replies, drained from the outbox by the relay like every other outgoing event.
mp.messaging.outgoing.stock-reserved.connector=smallrye-kafka
mp.messaging.outgoing.stock-reserved.topic=stock-reserved
mp.messaging.outgoing.stock-reserved.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.stock-reserved.acks=all
mp.messaging.outgoing.stock-reserved.enable.idempotence=true
mp.messaging.outgoing.stock-rejected.connector=smallrye-kafka
mp.messaging.outgoing.stock-rejected.topic=stock-rejected
mp.messaging.outgoing.stock-rejected.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.stock-rejected.acks=all
mp.messaging.outgoing.stock-rejected.enable.idempotence=true

mp.messaging.outgoing.product-updated.connector=smallrye-kafka
mp.messaging.outgoing.product-updated.topic=product-updated
mp.messaging.outgoing.product-updated.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.product-deleted.connector=smallrye-kafka
mp.messaging.outgoing.product-deleted.topic=product-deleted
mp.messaging.outgoing.product-deleted.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

# Producer hardening (spec section 4): durable, ordering-safe, broker-deduplicated relay publish.
# acks=all + enable.idempotence requires acks=all (SmallRye defaults to acks=1) and max.in.flight<=5;
# retries is bounded because the OutboxRelay tick re-sends any row left unpublished (durable outer retry).
mp.messaging.outgoing.product-updated.acks=all
mp.messaging.outgoing.product-updated.enable.idempotence=true
mp.messaging.outgoing.product-updated.max.in.flight.requests.per.connection=5
mp.messaging.outgoing.product-updated.retries=10
mp.messaging.outgoing.product-deleted.acks=all
mp.messaging.outgoing.product-deleted.enable.idempotence=true
mp.messaging.outgoing.product-deleted.max.in.flight.requests.per.connection=5
mp.messaging.outgoing.product-deleted.retries=10

# Transactional outbox relay
products.outbox.poll-interval=1s
products.outbox.batch-size=100
# Per-row publish retry cap: after this many failed attempts on a poison row (bad payload /
# unknown topic) the relay stamps it failed and stops retrying it. Broker outages do not count.
products.outbox.max-retries=5

# Outbox retention purge: drop rows published longer ago than the retention window, keeping a
# short-term audit trail. Unpublished rows are never purged. retention is an ISO-8601 duration.
products.outbox.purge-interval=1h
products.outbox.retention=P7D

# Object storage (LocalStack)
products.storage.endpoint=http://localstack:4566
products.storage.region=us-east-1
products.storage.access-key=test
products.storage.secret-key=test

%dev.products.storage.endpoint=http://localhost:4566

products.images.bucket=product-images

# Default seed images. When enabled, SeedImageInitializer gives each seeded product a
# deterministic image_key (where null) on startup and uploads the matching committed WebP to
# object storage. Off by default so a real production deployment does neither; on under dev/test,
# and switched on for the Compose stack via PRODUCTS_SEED_IMAGES_ENABLED (see docker-compose.yml),
# which runs a prod-profile build but still wants the seeded catalog to show real photos.
products.seed-images.enabled=false
%dev.products.seed-images.enabled=true
%test.products.seed-images.enabled=true

# JWT verification - the review write endpoints (POST/DELETE /reviews) validate the end-user's
# bearer token, same convention as orders-service. authenticate-service mints RS256 tokens with
# no issuer claim, so no mp.jwt.verify.issuer is set here (an issuer would reject every real token).
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%dev.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%test.mp.jwt.verify.publickey.location=publicKey.pem
# Tests mint their own RS256 tokens to exercise real JWT verification (test keypair in test resources)
%test.smallrye.jwt.sign.key.location=privateKey.pem

# REST client for purchase verification (reviews) - reuses orders-service's order search
the.chak.ecommerce.orders.boundary.OrdersApi/mp-rest/url=http://api-gateway:8080/api
the.chak.ecommerce.orders.boundary.OrdersApi/mp-rest/scope=jakarta.inject.Singleton

# Zero-trust internal hop: forward the end-user's Authorization header on the products -> orders
# rest-client call so orders-service independently verifies the same token (matches
# orders-service's own orders -> pricing propagation; see PricingApiClient/OrdersApi).
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization

# OpenAPI / Swagger UI - spec served at /q/openapi; UI available in dev mode only
quarkus.swagger-ui.always-include=false

# JSON config - snake_case + null omission via CustomJsonbConfigCustomizer
