quarkus.application.name=analytics-service
quarkus.http.port=8080

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] traceId=%X{traceId} spanId=%X{spanId} %s%e%n

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.traces.sampler=always_on
quarkus.otel.logs.enabled=true
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%test.quarkus.otel.sdk.disabled=true

# Warehouse datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.acquisition-timeout=PT300S
quarkus.datasource.jdbc.url=jdbc:postgresql://analytics-postgres:5432/analytics
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.generation=validate

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Ingestion channels. The warehouse reads from the beginning so it backfills on a fresh volume.
%dev.kafka.bootstrap.servers=localhost:9092
%prod.kafka.bootstrap.servers=kafka:9092

mp.messaging.incoming.order-paid.connector=smallrye-kafka
mp.messaging.incoming.order-paid.topic=order-paid
mp.messaging.incoming.order-paid.group.id=analytics-service-order-paid
mp.messaging.incoming.order-paid.auto.offset.reset=earliest
mp.messaging.incoming.order-paid.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-paid.dead-letter-queue.topic=order-paid-dlq
mp.messaging.incoming.order-paid.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.order-paid.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.order-paid.fail-on-deserialization-failure=false

mp.messaging.incoming.product-updated.connector=smallrye-kafka
mp.messaging.incoming.product-updated.topic=product-updated
mp.messaging.incoming.product-updated.group.id=analytics-service-product-updated
mp.messaging.incoming.product-updated.auto.offset.reset=earliest
mp.messaging.incoming.product-updated.failure-strategy=dead-letter-queue
mp.messaging.incoming.product-updated.dead-letter-queue.topic=product-updated-dlq
mp.messaging.incoming.product-updated.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.product-updated.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.product-updated.fail-on-deserialization-failure=false

mp.messaging.incoming.product-deleted.connector=smallrye-kafka
mp.messaging.incoming.product-deleted.topic=product-deleted
mp.messaging.incoming.product-deleted.group.id=analytics-service-product-deleted
mp.messaging.incoming.product-deleted.auto.offset.reset=earliest
mp.messaging.incoming.product-deleted.failure-strategy=dead-letter-queue
mp.messaging.incoming.product-deleted.dead-letter-queue.topic=product-deleted-dlq
mp.messaging.incoming.product-deleted.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.product-deleted.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.product-deleted.fail-on-deserialization-failure=false

# JWT verification
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%dev.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem

# --- Kafka JSON ---------------------------------------------------------------
# Every channel here leaves its (de)serializer unset, so Quarkus generates a Jackson one - which
# means these four settings, not the JSON-B customizer, decide what arrives and what goes out.
# Without SNAKE_CASE every underscore-named field on an incoming event binds to nothing and reads
# as null, and the failure is silent: no error, just an empty result where the data should be.
#
# Stated here rather than inherited. These used to come from products-api/application.properties,
# merged in from the dependency jar - so this service's wire behaviour was set by a module it
# depends on only for DTOs, with nothing here to say so.
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.serialization-inclusion=NON_NULL
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false
