quarkus.http.test-port=0

# Warehouse schema comes from Liquibase, the same way it does in a real deployment.
quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:tc:postgresql:16-alpine:///analytics
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.datasource.jdbc.driver=org.testcontainers.jdbc.ContainerDatabaseDriver
quarkus.datasource.jdbc.acquisition-timeout=PT300S
%test.quarkus.devservices.enabled=false
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.liquibase.migrate-at-start=true

# Ingestion is driven directly through the consumer in tests, so no broker is needed.
%test.mp.messaging.incoming.order-initiated.connector=smallrye-in-memory
%test.mp.messaging.incoming.product-updated.connector=smallrye-in-memory
%test.mp.messaging.incoming.product-deleted.connector=smallrye-in-memory
