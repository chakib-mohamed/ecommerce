# Configuration file
# key = value
#quarkus.http.cors=true
quarkus.http.port=8080
quarkus.application.name=orders-service

## Log format - traceId/spanId are loaded into MDC by OpenTelemetry on every line
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] traceId=%X{traceId} spanId=%X{spanId} %s%e%n

## OpenTelemetry - export spans to the collector over OTLP/gRPC; it tail-samples and forwards to Jaeger
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.traces.sampler=always_on
# ship application logs over OTLP to the Collector (additive - console handler stays on)
quarkus.otel.logs.enabled=true
# dev (make dev-*) runs natively on the host, where the collector is reachable on localhost
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# tests have no collector; disable the SDK so the exporter does not spam connection failures
%test.quarkus.otel.sdk.disabled=true

# JWT verification - the @Authenticated cart/orders endpoints validate the end-user's bearer token.
# authenticate-service mints RS256 tokens with no issuer claim, so no mp.jwt.verify.issuer is set
# (an issuer here would reject every real token). The public key is the base64 DER held in JWT_PUBLIC_KEY.
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%dev.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%test.mp.jwt.verify.publickey.location=publicKey.pem

# Zero-trust internal hop: forward the end-user's Authorization header on the orders -> pricing
# rest-client call so price-service independently verifies the same token (see PricingApiClient).
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization

# Tests mint their own RS256 tokens to exercise real JWT verification (test keypair in test resources)
%test.smallrye.jwt.sign.key.location=privateKey.pem

## OpenAPI / Swagger UI - spec served at /q/openapi; UI available in dev mode only
quarkus.swagger-ui.always-include=false

## Redis - price cache
quarkus.redis.hosts=redis://redis:6379
cart.price-cache.ttl-minutes=15


## Mongodb config
quarkus.mongodb.connection-string = mongodb://mongodb:27017/?replicaSet=rs0
quarkus.mongodb.database = orders
## STANDARD UUID representation so the outbox entry id (UUID _id) encodes cleanly
quarkus.mongodb.uuid-representation=STANDARD
# Dev (make dev-orders) talks to the infra Mongo on localhost. The replica-set member is advertised
# as mongodb:27017 (unresolvable from the host), so connect directly - directConnection still
# supports the multi-document outbox transaction against the primary.
%dev.quarkus.mongodb.connection-string=mongodb://localhost:27017/?directConnection=true

## Test profile - use localhost Redis (PriceCacheService mocked; this avoids resolving "redis" hostname)
%test.quarkus.redis.hosts=redis://localhost:6379
%test.quarkus.redis.devservices.enabled=false

## Products Api endpoint conf
the.chak.ecommerce.products.boundary.ProductsApi/mp-rest/url=http://api-gateway:8080/api
the.chak.ecommerce.products.boundary.ProductsApi/mp-rest/scope=jakarta.inject.Singleton

## Pricing Api endpoint conf
the.chak.ecommerce.orders.control.PricingApiClient/mp-rest/url=http://api-gateway:8080/api
the.chak.ecommerce.orders.control.PricingApiClient/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
# Kafka configuration
mp.messaging.outgoing.order-initiated.connector=smallrye-kafka
mp.messaging.outgoing.order-initiated.topic=order-initiated
%dev.mp.messaging.outgoing.order-initiated.bootstrap.servers=localhost:9092
%prod.mp.messaging.outgoing.order-initiated.bootstrap.servers=kafka:9092
mp.messaging.outgoing.order-initiated.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
# acks=all + enable.idempotence requires acks=all (SmallRye defaults to acks=1) and max.in.flight<=5;
# retries is bounded because the OutboxRelay tick re-sends any row left unpublished (durable outer retry).
mp.messaging.outgoing.order-initiated.acks=all
mp.messaging.outgoing.order-initiated.enable.idempotence=true
mp.messaging.outgoing.order-initiated.max.in.flight.requests.per.connection=5
mp.messaging.outgoing.order-initiated.retries=10

# Transactional outbox relay
orders.outbox.poll-interval=1s
orders.outbox.batch-size=100
# Per-row publish retry cap: after this many failed attempts on a poison entry (bad payload /
# unknown topic) the relay stamps it failed and stops retrying it. Broker outages do not count.
orders.outbox.max-retries=5

# Outbox retention purge: drop entries published longer ago than the retention window, keeping a
# short-term audit trail. Unpublished entries are never purged. retention is an ISO-8601 duration.
orders.outbox.purge-interval=1h
orders.outbox.retention=P7D

## JSON config - snake_case + null omission via CustomJsonbConfigCustomizer

# --- Saga: commands out, replies in -------------------------------------------------
# Everything is keyed by order id so one order's messages keep their order on the broker;
# a release must never overtake the reserve it compensates.
mp.messaging.outgoing.reserve-stock.connector=smallrye-kafka
mp.messaging.outgoing.reserve-stock.topic=reserve-stock
mp.messaging.outgoing.reserve-stock.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.reserve-stock.acks=all
mp.messaging.outgoing.reserve-stock.enable.idempotence=true
mp.messaging.outgoing.release-stock.connector=smallrye-kafka
mp.messaging.outgoing.release-stock.topic=release-stock
mp.messaging.outgoing.release-stock.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.release-stock.acks=all
mp.messaging.outgoing.release-stock.enable.idempotence=true
mp.messaging.outgoing.order-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.order-cancelled.topic=order-cancelled
mp.messaging.outgoing.order-cancelled.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.order-cancelled.acks=all
mp.messaging.outgoing.order-cancelled.enable.idempotence=true
mp.messaging.outgoing.capture-payment.connector=smallrye-kafka
mp.messaging.outgoing.capture-payment.topic=capture-payment
mp.messaging.outgoing.capture-payment.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer
mp.messaging.outgoing.capture-payment.acks=all
mp.messaging.outgoing.capture-payment.enable.idempotence=true

# Replies. Dead-lettered rather than retried forever: a poison reply must not block the
# partition and stall every other order's saga.
mp.messaging.incoming.stock-reserved.connector=smallrye-kafka
mp.messaging.incoming.stock-reserved.topic=stock-reserved
mp.messaging.incoming.stock-reserved.value.deserializer=the.chak.ecommerce.orders.control.events.StockReservedEventDeserializer
mp.messaging.incoming.stock-reserved.group.id=orders-service-stock-reserved
mp.messaging.incoming.stock-reserved.failure-strategy=dead-letter-queue
mp.messaging.incoming.stock-reserved.dead-letter-queue.topic=stock-reserved-dlq
mp.messaging.incoming.stock-reserved.fail-on-deserialization-failure=false
mp.messaging.incoming.stock-reserved.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.stock-reserved.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.stock-rejected.connector=smallrye-kafka
mp.messaging.incoming.stock-rejected.topic=stock-rejected
mp.messaging.incoming.stock-rejected.value.deserializer=the.chak.ecommerce.orders.control.events.StockRejectedEventDeserializer
mp.messaging.incoming.stock-rejected.group.id=orders-service-stock-rejected
mp.messaging.incoming.stock-rejected.failure-strategy=dead-letter-queue
mp.messaging.incoming.stock-rejected.dead-letter-queue.topic=stock-rejected-dlq
mp.messaging.incoming.stock-rejected.fail-on-deserialization-failure=false
mp.messaging.incoming.stock-rejected.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.stock-rejected.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-captured.connector=smallrye-kafka
mp.messaging.incoming.payment-captured.topic=payment-captured
mp.messaging.incoming.payment-captured.value.deserializer=the.chak.ecommerce.orders.control.events.PaymentCapturedEventDeserializer
mp.messaging.incoming.payment-captured.group.id=orders-service-payment-captured
mp.messaging.incoming.payment-captured.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-captured.dead-letter-queue.topic=payment-captured-dlq
mp.messaging.incoming.payment-captured.fail-on-deserialization-failure=false
mp.messaging.incoming.payment-captured.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.payment-captured.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-failed.connector=smallrye-kafka
mp.messaging.incoming.payment-failed.topic=payment-failed
mp.messaging.incoming.payment-failed.value.deserializer=the.chak.ecommerce.orders.control.events.PaymentFailedEventDeserializer
mp.messaging.incoming.payment-failed.group.id=orders-service-payment-failed
mp.messaging.incoming.payment-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-failed.dead-letter-queue.topic=payment-failed-dlq
mp.messaging.incoming.payment-failed.fail-on-deserialization-failure=false
mp.messaging.incoming.payment-failed.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.payment-failed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# How long a saga step is worth waiting for, and how often expired ones are swept up.
# Reservations have no expiry of their own, so this deadline is the only thing that ever
# frees stock held by a stalled saga.
orders.saga.step-timeout=PT5M
orders.saga.sweep-interval=30s
