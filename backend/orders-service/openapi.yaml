openapi: 3.0.3
info:
  title: orders-service API
  description: Shopping cart and order management. All endpoints require authentication.
  version: 1.0.0
servers:
  - url: /
    description: Service-internal base path

security:
  - bearerAuth: []

paths:

  /cart:
    get:
      summary: Get the current user's cart
      operationId: getCart
      responses:
        '200':
          description: Cart retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: No cart exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Clear the entire cart
      operationId: clearCart
      responses:
        '204':
          description: Cart cleared

  /cart/items:
    post:
      summary: Add a product to the cart
      operationId: addItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '201':
          description: Item added; updated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Validation error (blank product_id or quantity < 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cart/items/{productId}:
    put:
      summary: Update the quantity of a cart item
      operationId: updateItem
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item updated; updated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Validation error (quantity < 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Remove a single item from the cart
      operationId: removeItem
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Item removed
        '404':
          description: Product not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cart/checkout:
    post:
      summary: Checkout — create an order from the cart and clear it
      description: Converts the current cart into an order, clears it, and returns the created order.
      operationId: checkout
      responses:
        '201':
          description: Order created from cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Cart is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Price service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    post:
      summary: Create an order directly (without cart)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an order
      description: Only an order that has not been confirmed yet can be changed.
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The order belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The order has already been confirmed and can no longer be changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/search:
    post:
      summary: Search orders
      operationId: searchOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchOrdersCommand'
      responses:
        '200':
          description: Total count and page of matching orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSearchResult'
        '400':
          description: Validation error (blank user_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderID}:
    delete:
      summary: Delete an order
      description: Only an order that has not been confirmed yet can be removed.
      operationId: deleteOrder
      parameters:
        - name: orderID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order deleted
        '403':
          description: The order belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The order has already been confirmed and can no longer be removed. Cancel it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderID}/confirm:
    post:
      summary: Confirm an order
      description: >-
        Commits the order so it can be fulfilled, and requests payment for it using the supplied
        payment method. Confirming an order that is already confirmed has no further effect and is
        reported as a conflict.
      operationId: confirmOrder
      parameters:
        - name: orderID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOrderRequest'
      responses:
        '200':
          description: >-
            The order has been committed and payment has been requested. This does not mean payment
            has completed: the order goes on to reach its final state on its own, and the outcome —
            including a declined payment — is reported by the order's status and status_reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: No payment method was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The order belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The order cannot be confirmed: either it is no longer awaiting confirmation, or the
            price of one or more products has changed since the order was placed. The response
            names the affected products with their previous and current prices, so the order can
            be reviewed and placed again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderID}/cancel:
    post:
      summary: Cancel an order
      description: >-
        Stops an order the buyer no longer wants and gives back anything set aside for it.
        Available until the order is being paid for; once payment is under way it can no longer be
        cancelled, and neither can an order that has shipped or already reached a final state.
      operationId: cancelOrder
      parameters:
        - name: orderID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '403':
          description: The order belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The order cannot be cancelled: it is already being paid for, has shipped, or has
            reached a final state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderID}/ship:
    post:
      summary: Mark an order as shipped
      description: >-
        Records that an order has been dispatched to the buyer. Only an order that has been paid for
        can be shipped, and an order ships once. Restricted to administrators.
      operationId: shipOrder
      parameters:
        - name: orderID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order has been recorded as shipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The order cannot be shipped: it has not been paid for, or it has already been shipped or
            has since reached a final state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderID}/deliver:
    post:
      summary: Mark an order as delivered
      description: >-
        Records that a shipped order has reached the buyer. This is the order's final state.
        Restricted to administrators.
      operationId: deliverOrder
      parameters:
        - name: orderID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order has been recorded as delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '403':
          description: The caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The order cannot be delivered: it has not been shipped, or it has already been
            delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    CartResponse:
      type: object
      properties:
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
        updated_at:
          type: string
          format: date-time
          description: ISO-8601 datetime of the last cart modification

    CartItemResponse:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          format: decimal
        total_price:
          type: number
          format: decimal

    AddItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    UpdateItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    OrderDTO:
      type: object
      properties:
        id:
          type: string
        creation_date:
          type: string
          format: date-time
          description: ISO-8601 datetime
        price:
          type: number
          format: decimal
          description: Total for the whole order, with any discounts already applied.
        currency:
          type: string
          example: EUR
          description: ISO-4217 code the amounts on this order are denominated in.
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductVO'
        user_id:
          type: string
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          description: >-
            Where the order currently sits. Only an order still in INITIATED can be changed or
            removed; after that, use the cancel operation. CANCELLED, DELIVERED and REFUNDED are
            final.
        status_reason:
          type: string
          description: >-
            Why the order reached its current status, when it did not get there by the buyer's own
            action — a declined payment or an item that could not be supplied, for example. Present
            only when there is such a reason to give.

    ConfirmOrderRequest:
      type: object
      required:
        - payment_method
      properties:
        payment_method:
          type: string
          description: >-
            A single-use reference to the payment method the order is to be charged to, obtained by
            the client directly from the payment provider. Card details are never sent to this API
            and are never held by the platform. The reference is short-lived and cannot be reused
            for a second order.

    OrderRequest:
      type: object
      required:
        - products
      properties:
        id:
          type: string
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductVO'

    ProductVO:
      type: object
      required:
        - product_id
        - qty
        - price
      properties:
        product_id:
          type: string
        title:
          type: string
        qty:
          type: integer
          minimum: 1
        price:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        percentage_off:
          type: number
          format: double
          description: Active promotion discount percentage; omitted if no active promotion

    OrderStatus:
      type: string
      description: The states an order can be in over its life.
      enum:
        - INITIATED
        - CONFIRMED
        - RESERVED
        - PAID
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - REFUNDED

    SearchOrdersCommand:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
        product_id:
          type: string
          description: >-
            When provided, narrows results to orders containing this product —
            used to check whether a buyer has purchased a given product.
        statuses:
          type: array
          description: >-
            When provided, narrows results to orders currently in one of these
            states. Omit it to search every order regardless of state.
          items:
            $ref: '#/components/schemas/OrderStatus'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        sort_by:
          type: string

    OrderSearchResult:
      type: object
      properties:
        x:
          type: integer
          format: int64
          description: Total number of matching orders
        y:
          type: array
          items:
            $ref: '#/components/schemas/OrderDTO'

    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          enum: [FUNCTIONAL, TECHNICAL]
        error_code:
          type: string
        message:
          type: string
