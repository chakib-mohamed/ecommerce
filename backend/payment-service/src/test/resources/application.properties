# Postgres via Testcontainers, and the schema built by the migrations - the same thing production
# runs. Hibernate validates the mapping against it rather than generating one from the entities,
# which is what makes a column that does not exist a failure here instead of at deployment.
%test.quarkus.datasource.jdbc.url=jdbc:tc:postgresql:16-alpine:///payment
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
%test.quarkus.datasource.jdbc.driver=org.testcontainers.jdbc.ContainerDatabaseDriver
%test.quarkus.devservices.enabled=false
# The first connection is what starts the container, so the wait has to cover pulling and booting
# Postgres, not just handing out a pooled connection. products-service allows the same.
%test.quarkus.datasource.jdbc.acquisition-timeout=PT300S

# The relay's own timer is parked so the tests drive it explicitly and do not race a background
# tick. requestPoll() after a commit is the path production uses anyway.
%test.payment.outbox.poll-interval=24h

# Read from the start of the topic. The default is to read only what arrives after the consumer has
# joined, and a test publishes as soon as the application is up - so the first message of a run was
# being dropped before anyone was listening, and the test that sent it waited out its timeout for a
# reply to something nobody received. It passed alone and failed in a suite, which is the tell.
%test.mp.messaging.incoming.capture-payment.auto.offset.reset=earliest
%test.mp.messaging.incoming.refund-payment.auto.offset.reset=earliest
