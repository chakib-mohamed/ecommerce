quarkus.http.port=8087
quarkus.application.name=payment-service

## Log format - traceId/spanId are loaded into MDC by OpenTelemetry on every line
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] traceId=%X{traceId} spanId=%X{spanId} %s%e%n

# --- Persistence -------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PAYMENT_DB_USER:payment}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD:payment}
quarkus.datasource.jdbc.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/payment}
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# --- Payment provider --------------------------------------------------------
# The URL alone decides whether this is the mock or the real API. There is no flag and no
# fallback: a misconfiguration fails loudly rather than quietly reporting charges never made.
payment.stripe.url=${PAYMENT_STRIPE_URL:http://localhost:12111}
payment.stripe.api-key=${PAYMENT_STRIPE_API_KEY:sk_test_local}
payment.stripe.timeout=PT10S

# --- Messaging ---------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.capture-payment.connector=smallrye-kafka
mp.messaging.incoming.capture-payment.topic=capture-payment
mp.messaging.incoming.capture-payment.group.id=payment-service
mp.messaging.incoming.capture-payment.value.deserializer=the.chak.ecommerce.payment.control.events.CapturePaymentCommandDeserializer

mp.messaging.incoming.refund-payment.connector=smallrye-kafka
mp.messaging.incoming.refund-payment.topic=refund-payment
mp.messaging.incoming.refund-payment.group.id=payment-service
mp.messaging.incoming.refund-payment.value.deserializer=the.chak.ecommerce.payment.control.events.RefundPaymentCommandDeserializer

mp.messaging.outgoing.payment-captured.connector=smallrye-kafka
mp.messaging.outgoing.payment-captured.topic=payment-captured
mp.messaging.outgoing.payment-captured.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.payment-failed.connector=smallrye-kafka
mp.messaging.outgoing.payment-failed.topic=payment-failed
mp.messaging.outgoing.payment-failed.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

# --- Transactional outbox relay ----------------------------------------------
# Without this the replies would be written and never sent, and every order would wait on a
# payment that had already happened.
payment.outbox.poll-interval=1s
payment.outbox.batch-size=100
# Per-row publish retry cap: after this many failed attempts on a poison row the relay stamps it
# failed and stops retrying. Broker outages do not count.
payment.outbox.max-retries=5

# --- Observability -----------------------------------------------------------
## Export spans to the collector over OTLP/gRPC; it tail-samples and forwards to Jaeger
quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
quarkus.otel.traces.sampler=always_on
# ship application logs over OTLP to the Collector (additive - console handler stays on)
quarkus.otel.logs.enabled=true
# dev (make dev-payment) runs natively on the host, where the collector is reachable on localhost
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# tests have no collector; disable the SDK so the exporter does not spam connection failures
%test.quarkus.otel.sdk.disabled=true

# Tests drive the provider through WireMock, which each test points at its own port.
%test.payment.stripe.api-key=sk_test_dummy
