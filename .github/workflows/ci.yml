name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc      # Node 20.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps             # matches frontend/Dockerfile
      - run: npm run lint
      - run: npm run build                         # tsc + vite build

  backend:
    runs-on: ubuntu-latest                         # Docker preinstalled -> Testcontainers works
    env:
      TESTCONTAINERS_REUSE_ENABLE: "true"          # share Mongo/Kafka/etc. across the sequential per-service runs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                           # need history to diff a PR against its base
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Which services actually need verifying. On push to main (and manual runs) that
      # is always all of them — the post-merge run is the backstop that catches anything
      # the PR-time filter got wrong. On a PR, only the services touched by the diff or
      # depending on a changed shared module. See .github/scripts/affected-services.sh.
      - name: Select affected services
        id: select
        working-directory: .
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request -> verifying every service."
            services=$(printf '%s\n' authenticate-service featured-products-service \
              price-service orders-service products-service analytics-service \
              ecommerce-api-gateway)
          elif ! git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1; then
            # Never silently narrow the run because the base ref was unreachable.
            echo "::warning::Could not fetch base ref '${{ github.base_ref }}' -> verifying every service."
            services=$(printf '%s\n' authenticate-service featured-products-service \
              price-service orders-service products-service analytics-service \
              ecommerce-api-gateway)
          else
            base=$(git merge-base FETCH_HEAD HEAD)
            echo "Diffing against $base"
            git diff --name-only "$base" HEAD | tee /tmp/changed-paths.txt
            services=$(.github/scripts/affected-services.sh < /tmp/changed-paths.txt)
          fi
          echo "Selected services:"
          echo "${services:-  (none - no backend impact)}"
          {
            echo 'services<<EOF'
            echo "$services"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Sequential per-service `verify`: full lifecycle = compile + unit + integration
      # tests + Checkstyle + SpotBugs + JaCoCo coverage. One service at a time so
      # Testcontainers never saturates Docker.
      #
      # The shared modules are installed once up front instead of being rebuilt by `-am`
      # on every service (which cost ~67s per run). `install` rather than
      # `install -DskipTests`: outbox-common has tests that used to run as a side effect
      # of `-am`, and they must still run — just once now, with its Checkstyle/SpotBugs/
      # JaCoCo gates. products-api and orders-api have no tests.
      #
      # This step always runs, even with nothing selected: a skipped job would leave the
      # `backend` required status check unsatisfied.
      - name: Backend verify (per service, sequential)
        run: |
          set -euo pipefail
          mapfile -t SERVICES < <(printf '%s\n' "${{ steps.select.outputs.services }}" | sed '/^$/d')
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No backend changes in this PR - nothing to verify."
            exit 0
          fi
          echo "::group::install shared modules (products-api, orders-api, outbox-common)"
          ./mvnw -B --no-transfer-progress install -pl products-api,orders-api,outbox-common -am
          echo "::endgroup::"
          for svc in "${SERVICES[@]}"; do
            echo "::group::verify $svc"
            ./mvnw -B --no-transfer-progress verify -pl "$svc"
            echo "::endgroup::"
          done

      # The coverage gate cannot report whether it measured anything: JaCoCo prints the same
      # success line for seven classes checked and for none, which is how it enforced nothing for
      # its whole life. This reads the poms and the reports and says so.
      - name: Verify the coverage gate enforced something
        if: steps.select.outputs.services != ''
        working-directory: .
        run: python3 .github/scripts/verify-coverage-gate.py

  # Full-stack browser suite (e2e/) — boots the real docker-compose stack (6 JVM
  # services + Postgres/Mongo/Kafka/Redis/Zookeeper + the built frontend image),
  # so it's meaningfully slower than the jobs above. Not run on every PR by
  # default: fires on push to main (post-merge signal, same-commit
  # bisectability) plus an opt-in "e2e" PR label for PRs that specifically
  # touch cross-service flows (auth, checkout, gateway config). See
  # docs/specs/e2e-test-suite.md.
  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest                         # Docker preinstalled
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Freshly generated, self-signed, throwaway keys — no CI secrets needed.
      - run: make e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        run: docker compose --profile "*" logs --no-color > compose-logs.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

  # Dependency vulnerability gate: one Trivy fs scan over the whole repo covers
  # both the Maven backend (backend/**/pom.xml) and the npm frontend
  # (frontend/package-lock.json). A fresh checkout has no node_modules, so only
  # declared dependencies are scanned.
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write          # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v5

      # Report pass: all severities, never fails — produces the SARIF report.
      - name: Trivy vulnerability scan (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif

      # Upload even when the gate pass below fails, so findings always surface.
      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # Gate pass: fail the build only on CRITICAL vulnerabilities. Trivy's vuln
      # DB is cached from the pass above, so this is fast.
      - name: Trivy vulnerability gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
